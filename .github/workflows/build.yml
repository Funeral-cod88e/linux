name: Build A02s Kernel (barni2000 7.1.3)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex git libssl-dev libncurses-dev gcc-aarch64-linux-gnu device-tree-compiler mkbootimg wget

      - name: Configure and Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # Ищем конфиг для a02q, если он есть рядом с msm8953_defconfig
          A02Q_CFG=$(ls arch/arm64/configs/*a02q* 2>/dev/null | xargs -n1 basename || true)
          make msm8953_defconfig $A02Q_CFG
          make -j$(nproc) Image.gz dtbs modules
          mkdir -p modules_out
          make INSTALL_MOD_PATH=modules_out modules_install

      - name: Build ARM64 Initramfs
        run: |
          mkdir -p initrd/{bin,dev,proc,sys,mnt/root}
          wget -O initrd/bin/busybox https://busybox.net
          chmod +x initrd/bin/busybox
          cat << 'EOF' > initrd/init
          #!/bin/busybox sh
          /bin/busybox --install -s /bin
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t devtmpfs devtmpfs /dev
          sleep 3
          # Монтируем раздел userdata (проверьте номер раздела в TWRP!)
          mount -t ext4 /dev/disk/by-partlabel/userdata /mnt/root || mount -t ext4 /dev/mmcblk0p65 /mnt/root
          exec switch_root /mnt/root /sbin/init
          EOF
          chmod +x initrd/init
          cd initrd && find . | cpio -o -H newc | gzip > ../initramfs.cpio.gz

      - name: Pack boot.img
        run: |
          DTB_FILE=$(find arch/arm64/boot/dts/qcom/ -name "*a02q*.dtb" | head -n 1)
          echo "Using DTB: $DTB_FILE"
          cat arch/arm64/boot/Image.gz "$DTB_FILE" > Image.gz-dtb
          mkbootimg --kernel Image.gz-dtb --ramdisk initramfs.cpio.gz --cmdline "console=ttyMSM0,115200n8" --base 0x80000000 --pagesize 2048 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --tags_offset 0x00000100 -o boot-alpine.img

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a02q-7.1.3-alpine
          path: |
            boot-alpine.img
            modul
es_out/
